[package]
name = "dart_simu_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = "0.20"
futures = "0.3"
url = "2"
clap = { version = "4", features = ["derive"] }
